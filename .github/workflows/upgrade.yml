name: Upgrade from prior previews
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        prior: ['0.6.0', '0.10.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build v0.11.0
        shell: bash
        run: ./mvnw -B -ntp -DskipTests package
      - name: Download and verify prior published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_VERSION: ${{ matrix.prior }}
        run: |
          prior_dir="$RUNNER_TEMP/triage-prior"
          mkdir -p "$prior_dir"
          gh release download "v$PRIOR_VERSION" --repo MoChiUaena/agent-triage --pattern "agent-triage-$PRIOR_VERSION-demo.zip" --pattern "triage-spring-boot-starter-$PRIOR_VERSION*" --pattern SHA256SUMS.txt --dir "$prior_dir"
          prior_commit=$(gh api "repos/MoChiUaena/agent-triage/commits/v$PRIOR_VERSION" --jq .sha)
          python scripts/verify_release.py --directory "$prior_dir" --version "$PRIOR_VERSION" --source-commit "$prior_commit"
          python -c "import pathlib,zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); pathlib.Path(sys.argv[2]).write_bytes(z.read('agent-triage-'+sys.argv[3]+'/lib/agent-triage.jar'))" "$prior_dir/agent-triage-$PRIOR_VERSION-demo.zip" "$prior_dir/agent-triage.jar" "$PRIOR_VERSION"
      - name: Verify saved history and model settings after upgrade
        shell: bash
        env:
          PRIOR_VERSION: ${{ matrix.prior }}
        run: python scripts/upgrade_smoke.py --old-jar "$RUNNER_TEMP/triage-prior/agent-triage.jar" --prior-version "$PRIOR_VERSION" --new-jar target/agent-triage-0.11.0.jar
