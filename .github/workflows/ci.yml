name: Verify
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Offline tests / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp verify
      - name: Check browser script syntax
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/settings.js
  postgres:
    name: PostgreSQL HTTP integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: triage
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -Dtest=RunApiTest,ProviderSettingsTest test
        env:
          TRIAGE_TEST_DB_URL: jdbc:postgresql://localhost:5432/triage
          TRIAGE_TEST_DB_USER: triage
          TRIAGE_TEST_DB_PASSWORD: triage-ci
  live-lab:
    name: Live sample and model protocol integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and exercise actual order requests
        run: |
          ./mvnw -B -ntp -f inventory-service/pom.xml verify
          ./mvnw -B -ntp -f sample-service/pom.xml verify
          ./mvnw -B -ntp -DskipTests package
          java -jar inventory-service/target/triage-inventory-service-0.1.0-SNAPSHOT.jar > inventory.log 2>&1 &
          java -jar sample-service/target/triage-sample-service-0.1.0-SNAPSHOT.jar > sample.log 2>&1 &
          java -jar target/agent-triage-0.1.0-SNAPSHOT.jar --server.port=18083 '--spring.datasource.url=jdbc:h2:mem:live;DB_CLOSE_DELAY=-1' --triage.observation.source=LIVE --triage.settings.key-file=target/ci-live-key > agent.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:18084/lab/scenario > /dev/null && curl -fsS http://127.0.0.1:18082/lab/scenario > /dev/null && curl -fsS http://127.0.0.1:18083/api/config > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/live_smoke.py
          python3 scripts/model_protocol_stub.py --port 18100 > model-stub.log 2>&1 &
          stub_pid=$!
          java -jar target/agent-triage-0.1.0-SNAPSHOT.jar --server.port=18085 '--spring.datasource.url=jdbc:h2:mem:live-model;DB_CLOSE_DELAY=-1' --triage.settings.key-file=target/ci-live-model-key --triage.observation.source=LIVE --triage.mode=MODEL --triage.model.base-url=http://127.0.0.1:18100 --triage.model.api-key=test-only-local --triage.model.name=triage-stub --triage.model.timeout=5s > model-agent.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18085/api/config > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/live_model_eval.py --allow-model-calls --mock-provider --agent-url http://127.0.0.1:18085
          python3 scripts/compare_live_methods.py --allow-model-calls --mock-provider --agent-url http://127.0.0.1:18085
          python3 scripts/compare_live_methods.py --allow-model-calls --mock-provider --agent-url http://127.0.0.1:18085 --ids D10
          python3 scripts/compare_live_methods.py --allow-model-calls --mock-provider --agent-url http://127.0.0.1:18085 --dataset docs/evaluation/cases-v2.json --all-dev
          kill "$stub_pid"
          wait "$stub_pid" || true
          python3 scripts/model_protocol_stub.py --port 18100 --invalid-first-arguments > correction-stub.log 2>&1 &
          sleep 1
          python3 scripts/live_model_eval.py --allow-model-calls --mock-provider --expect-argument-correction --agent-url http://127.0.0.1:18085
