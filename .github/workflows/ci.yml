name: Verify
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Offline tests / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp verify
      - name: Check browser script syntax
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/settings.js
          node --check src/main/resources/static/workspace.js
      - name: Verify Spring Boot starter and independent application
        shell: bash
        run: ./mvnw -B -ntp -f integrations/pom.xml verify
  postgres:
    name: PostgreSQL HTTP integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: triage
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -Dtest=RunApiTest,ProviderSettingsTest,HistoryApiTest,StatisticsApiTest test
        env:
          TRIAGE_TEST_DB_URL: jdbc:postgresql://localhost:5432/triage
          TRIAGE_TEST_DB_USER: triage
          TRIAGE_TEST_DB_PASSWORD: triage-ci
  live-lab:
    name: Live sample and model protocol integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and exercise actual order requests
        run: |
          ./mvnw -B -ntp -f inventory-service/pom.xml verify
          ./mvnw -B -ntp -f sample-service/pom.xml verify
          ./mvnw -B -ntp -f database-service/pom.xml verify
          ./mvnw -B -ntp -DskipTests package
          ./mvnw -B -ntp -f integrations/pom.xml -DskipTests package
          python3 scripts/starter_smoke.py
          java -jar inventory-service/target/triage-inventory-service-0.2.0.jar > inventory.log 2>&1 &
          java -jar sample-service/target/triage-sample-service-0.2.0.jar > sample.log 2>&1 &
          java -jar target/agent-triage-0.2.0.jar --server.port=18083 '--spring.datasource.url=jdbc:h2:mem:live;DB_CLOSE_DELAY=-1' --triage.observation.source=LIVE --triage.settings.key-file=target/ci-live-key > agent.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:18084/lab/scenario > /dev/null && curl -fsS http://127.0.0.1:18082/lab/scenario > /dev/null && curl -fsS http://127.0.0.1:18083/api/config > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/live_smoke.py
          python3 scripts/model_protocol_stub.py --port 18100 > model-stub.log 2>&1 &
          stub_pid=$!
          java -jar target/agent-triage-0.2.0.jar --server.port=18085 '--spring.datasource.url=jdbc:h2:mem:live-model;DB_CLOSE_DELAY=-1' --triage.settings.key-file=target/ci-live-model-key --triage.observation.source=LIVE --triage.mode=MODEL --triage.model.base-url=http://127.0.0.1:18100 --triage.model.api-key=test-only-local --triage.model.name=triage-stub --triage.model.timeout=5s > model-agent.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18085/api/config > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/live_model_eval.py --allow-model-calls --mock-provider --agent-url http://127.0.0.1:18085
          python3 scripts/compare_live_methods.py --allow-model-calls --mock-provider --agent-url http://127.0.0.1:18085
          python3 scripts/compare_live_methods.py --allow-model-calls --mock-provider --agent-url http://127.0.0.1:18085 --ids D10
          python3 scripts/compare_live_methods.py --allow-model-calls --mock-provider --agent-url http://127.0.0.1:18085 --dataset docs/evaluation/cases-v2.json --all-dev
          java -jar inventory-service/target/triage-inventory-service-0.2.0.jar --server.port=18094 > checkout-inventory.log 2>&1 &
          java -jar sample-service/target/triage-sample-service-0.2.0.jar --server.port=18092 --sample.service-id=checkout-service --sample.lab-enabled=false --sample.inventory.base-url=http://127.0.0.1:18094 --sample.error-log-file=target/checkout-errors.jsonl > checkout.log 2>&1 &
          java -jar target/agent-triage-0.2.0.jar --server.port=18093 '--spring.datasource.url=jdbc:h2:mem:registered-model;DB_CLOSE_DELAY=-1' --spring.config.additional-location=file:./examples/services.yml --triage.settings.key-file=target/ci-registered-key --triage.mode=MODEL --triage.model.base-url=http://127.0.0.1:18100 --triage.model.api-key=test-only-local --triage.model.name=triage-stub --triage.model.timeout=5s > registered-agent.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:18094/lab/scenario > /dev/null && curl -fsS http://127.0.0.1:18092/actuator/health > /dev/null && curl -fsS 'http://127.0.0.1:18093/api/config?service=checkout-service' > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/service_integration_smoke.py --mock-provider
          java -jar database-service/target/triage-database-service-0.2.0.jar > database.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18096/actuator/health > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/db_pool_smoke.py --mock-provider
          java -jar target/agent-triage-0.2.0.jar --server.port=18087 '--spring.datasource.url=jdbc:h2:mem:run-controls;DB_CLOSE_DELAY=-1' --triage.settings.key-file=target/ci-run-controls-key --triage.observation.source=LIVE --triage.mode=MODEL --triage.model.base-url=http://127.0.0.1:18102 --triage.model.api-key=test-only-local --triage.model.name=controls-stub --triage.model.timeout=10s --triage.run-timeout=30s > controls-agent.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18087/api/config > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/run_controls_smoke.py
          kill "$stub_pid"
          wait "$stub_pid" || true
          python3 scripts/model_protocol_stub.py --port 18100 --invalid-first-arguments > correction-stub.log 2>&1 &
          correction_stub_pid=$!
          sleep 1
          python3 scripts/live_model_eval.py --allow-model-calls --mock-provider --expect-argument-correction --agent-url http://127.0.0.1:18085
          kill "$correction_stub_pid"
          wait "$correction_stub_pid" || true
          python3 scripts/model_protocol_stub.py --port 18100 --omit-rules-first > evidence-stub.log 2>&1 &
          sleep 1
          python3 scripts/live_model_eval.py --allow-model-calls --mock-provider --expect-evidence-feedback --agent-url http://127.0.0.1:18085
          python3 scripts/package_release.py
          python3 scripts/verify_release.py --source-commit "$(git rev-parse HEAD)"
          python3 -c "import zipfile; zipfile.ZipFile('target/release/agent-triage-0.2.0-demo.zip').extractall('target/bundle-smoke')"
          bash target/bundle-smoke/agent-triage-0.2.0/start-demo.sh 18180 > bundle.log 2>&1 &
          bundle_pid=$!
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:18180/api/config > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/live_smoke.py --agent-url http://127.0.0.1:18180 --sample-url http://127.0.0.1:18182 --inventory-url http://127.0.0.1:18184
          for i in {1..60}; do
            if curl -fsS 'http://127.0.0.1:18180/api/config?service=catalog-db-service' | grep -q '"observationAvailable":true'; then break; fi
            sleep 1
          done
          python3 scripts/db_pool_smoke.py --agent-url http://127.0.0.1:18180 --database-url http://127.0.0.1:18186
          python3 scripts/bundle_services_smoke.py
          kill "$bundle_pid"
          wait "$bundle_pid" || true
          bundle_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for endpoint in 18180/api/config 18182/lab/scenario 18184/lab/scenario 18186/actuator/health "18188/triage/observations?windowMinutes=1&endTime=$bundle_end" "18189/triage/observations?windowMinutes=1&endTime=$bundle_end"; do
            if curl -fsS --max-time 2 "http://127.0.0.1:$endpoint" > /dev/null; then
              echo "Bundle service at $endpoint did not stop" >&2
              exit 1
            fi
          done
