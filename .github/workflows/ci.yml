name: Verify
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Offline tests / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp verify
      - name: Check browser script syntax
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/settings.js
          node --check src/main/resources/static/theme-preview.js
  postgres:
    name: PostgreSQL HTTP integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: triage
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -Dtest=RunApiTest,ProviderSettingsTest test
        env:
          TRIAGE_TEST_DB_URL: jdbc:postgresql://localhost:5432/triage
          TRIAGE_TEST_DB_USER: triage
          TRIAGE_TEST_DB_PASSWORD: triage-ci
