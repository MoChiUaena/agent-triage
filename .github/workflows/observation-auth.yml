name: Observation token rotation acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Agent, Starter and independent application
        run: |
          ./mvnw -B -ntp -DskipTests package
          ./mvnw -B -ntp -f triage-spring-boot-starter/pom.xml -DskipTests install
          ./mvnw -B -ntp -f catalog-service/pom.xml -DskipTests package
      - name: Verify protected observations and token rotation
        run: python3 scripts/observation_auth_smoke.py
      - name: Confirm verification processes stopped
        run: |
          for endpoint in 18780/api/config 18781/api/config 18782/triage/observations; do
            if curl -sS --max-time 2 "http://127.0.0.1:$endpoint" >/dev/null; then
              echo "Verification process at $endpoint did not stop" >&2
              exit 1
            fi
          done
