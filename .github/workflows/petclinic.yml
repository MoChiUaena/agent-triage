name: Public Spring Petclinic acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: petclinic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Agent and install observation Starter
        run: |
          ./mvnw -B -ntp -DskipTests package
          ./mvnw -B -ntp -f triage-spring-boot-starter/pom.xml -DskipTests install
      - name: Prepare pinned public application
        run: |
          public_dir="$RUNNER_TEMP/triage-petclinic"
          git clone --filter=blob:none --no-checkout https://github.com/spring-projects/spring-petclinic.git "$public_dir"
          git -C "$public_dir" checkout --detach 67643c4137eb75bfeb177b427f8459c471bdcbd8
          python3 scripts/prepare_petclinic.py "$public_dir"
          ./mvnw -B -ntp -f "$public_dir/pom.xml" -DskipTests -Dcheckstyle.skip -Dspring-javaformat.skip package
      - name: Verify original requests, exceptions and source versions
        run: python3 scripts/petclinic_smoke.py --project-directory "$RUNNER_TEMP/triage-petclinic"
      - name: Confirm both verification processes stopped
        run: |
          for endpoint in 18460/api/config 18461/actuator/health; do
            if curl -fsS --max-time 2 "http://127.0.0.1:$endpoint" >/dev/null; then
              echo "Verification process at $endpoint did not stop" >&2
              exit 1
            fi
          done
