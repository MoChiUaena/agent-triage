name: Public Spring Petclinic REST acceptance
on:
  workflow_dispatch:
    inputs:
      cost_seconds:
        description: Optional bounded V5 cost workload
        required: true
        default: '0'
        type: choice
        options: ['0', '60', '300']
permissions:
  contents: read
jobs:
  public-rest-project:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Agent and install Starter
        run: |
          ./mvnw -B -ntp -DskipTests package
          ./mvnw -B -ntp -f triage-spring-boot-starter/pom.xml -DskipTests install
      - name: Prepare pinned public REST application
        run: |
          public_dir="$RUNNER_TEMP/triage-petclinic-rest"
          git clone --filter=blob:none --no-checkout https://github.com/spring-petclinic/spring-petclinic-rest.git "$public_dir"
          git -C "$public_dir" checkout --detach 26a80b7a510af1fda0acdfb45d65aa480bdb7607
          python3 scripts/prepare_petclinic_rest.py "$public_dir"
          ./mvnw -B -ntp -f "$public_dir/pom.xml" -DskipTests package
      - name: Verify async attribution, response classes and source versions
        run: python3 scripts/petclinic_rest_smoke.py --project-directory "$RUNNER_TEMP/triage-petclinic-rest"
      - name: Compare classified request failures and mixed responses
        run: python3 scripts/petclinic_rest_smoke.py --project-directory "$RUNNER_TEMP/triage-petclinic-rest" --classified-inbound --base-port 18660
      - name: Verify multiple HTTP downstreams in the public project
        run: python3 scripts/petclinic_multi_downstream_smoke.py --project-directory "$RUNNER_TEMP/triage-petclinic-rest"
      - name: Measure bounded V5 workload
        if: inputs.cost_seconds != '0'
        run: python3 scripts/petclinic_multi_downstream_smoke.py --project-directory "$RUNNER_TEMP/triage-petclinic-rest" --base-port 18740 --load-seconds "${{ inputs.cost_seconds }}"
      - name: Upload only numeric cost evidence
        if: always() && inputs.cost_seconds != '0'
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-v5-cost-${{ inputs.cost_seconds }}
          path: |
            target/petclinic-multi-acceptance/**/cost.csv
            target/petclinic-multi-acceptance/**/requests.csv
            target/petclinic-multi-acceptance/**/cost-summary.json
            target/petclinic-multi-acceptance/**/cost-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm verification processes stopped
        if: always()
        run: |
          for endpoint in 18640/api/config 18641/petclinic/actuator/health 18642/delay 18660/api/config 18661/petclinic/actuator/health 18662/delay 18720/api/config 18721/petclinic/actuator/health 18722/delay '18723/payment?fail=false' 18740/api/config 18741/petclinic/actuator/health 18742/delay '18743/payment?fail=false'; do
            if curl -fsS --max-time 2 "http://127.0.0.1:$endpoint" >/dev/null; then
              echo "Verification process at $endpoint did not stop" >&2
              exit 1
            fi
          done
