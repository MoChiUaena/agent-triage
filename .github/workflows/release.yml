name: Preview package acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build all packaged modules
        run: |
          ./mvnw -B -ntp -DskipTests package
          ./mvnw -B -ntp -f inventory-service/pom.xml -DskipTests package
          ./mvnw -B -ntp -f sample-service/pom.xml -DskipTests package
          ./mvnw -B -ntp -f database-service/pom.xml -DskipTests package
          ./mvnw -B -ntp -f integrations/pom.xml -DskipTests package
      - name: Package and verify the clean source commit
        run: |
          python scripts/package_release.py
          python scripts/verify_release.py --source-commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-release-assets
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/agent-triage-0.10.0-demo.zip
            target/release/triage-spring-boot-starter-0.10.0.jar
            target/release/triage-spring-boot-starter-0.10.0.pom
            target/release/triage-spring-boot-starter-0.10.0-agent.jar
            target/release/SHA256SUMS.txt
  package:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: preview-release-assets
          path: target/release
      - name: Verify and extract the exact package built on Linux
        shell: bash
        run: |
          python scripts/verify_release.py --source-commit "$(git rev-parse HEAD)"
          python -c "import zipfile; zipfile.ZipFile('target/release/agent-triage-0.10.0-demo.zip').extractall('target/release-bundle')"
      - name: Exercise the native launcher and package contents
        run: python scripts/bundle_launch_smoke.py --bundle-directory target/release-bundle/agent-triage-0.10.0
