name: Runtime resource retention
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - 'src/main/java/io/github/mochiuaena/triage/execution/**'
      - 'src/test/java/io/github/mochiuaena/triage/execution/RunResourceLifecycleTest.java'
      - 'triage-spring-boot-starter/**'
      - 'scripts/resource_soak.py'
      - 'scripts/test_resource_soak.py'
      - 'scripts/resource_report.py'
      - 'scripts/test_resource_report.py'
      - '.github/workflows/runtime-resources.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      seconds:
        description: Continuous workload duration per component and platform
        required: true
        type: choice
        default: '3600'
        options: ['60', '300', '3600']
permissions:
  contents: read
concurrency:
  group: runtime-resources-${{ github.ref }}-${{ github.event.inputs.seconds || '300' }}
  cancel-in-progress: true
jobs:
  retention:
    name: Resources / ${{ matrix.component }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        component: [agent, starter]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify diagnostic parsing and growth gates
        run: python -m unittest discover -s scripts -p 'test_resource*.py'
      - name: Run continuous lifecycle checks with owned JVM diagnostics
        run: python scripts/resource_soak.py --component ${{ matrix.component }} --seconds "${{ github.event.inputs.seconds || '300' }}"
      - name: Keep numeric memory samples and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources-${{ matrix.component }}-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/resource-soak/**/memory.csv
            target/resource-soak/**/summary.json
