name: agent-triage
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${TRIAGE_DB_PASSWORD:-triage-local-demo}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - triage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  triage-postgres:
