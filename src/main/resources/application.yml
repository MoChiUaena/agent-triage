server:
  address: 127.0.0.1
  port: ${PORT:18080}
spring:
  application:
    name: agent-triage
  datasource:
    url: jdbc:h2:file:./data/triage;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 30000
triage:
  mode: ${TRIAGE_MODE:DEMO}
  max-tool-calls: ${TRIAGE_MAX_TOOL_CALLS:3}
  tool-timeout: ${TRIAGE_TOOL_TIMEOUT:2s}
  run-timeout: ${TRIAGE_RUN_TIMEOUT:60s}
  model:
    base-url: ${TRIAGE_MODEL_BASE_URL:https://api.deepseek.com}
    api-key: ${TRIAGE_MODEL_API_KEY:}
    name: ${TRIAGE_MODEL_NAME:deepseek-flash}
    timeout: ${TRIAGE_MODEL_TIMEOUT:20s}
    max-rounds: ${TRIAGE_MODEL_MAX_ROUNDS:4}
    max-tokens: ${TRIAGE_MODEL_MAX_TOKENS:1600}
  settings:
    key-file: ${TRIAGE_SETTINGS_KEY_FILE:./data/model-config.key}
# The SDK's warnings for empty responses include the full prompt.
logging:
  level:
    org.springframework.ai.openai.OpenAiChatModel: ERROR
