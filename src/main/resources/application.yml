server:
  address: 127.0.0.1
  port: ${PORT:18080}
spring:
  application:
    name: agent-triage
  datasource:
    url: jdbc:h2:file:./data/triage;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 30000
triage:
  max-tool-calls: 3
  tool-timeout: 2s
  run-timeout: 10s
