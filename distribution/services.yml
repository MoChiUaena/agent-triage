triage:
  observation:
    source: LIVE
  services:
    - id: order-service
      name: 订单服务
      downstream-id: inventory-service
      downstream-name: 库存服务
      base-url: http://127.0.0.1:${demo.order-port:18082}
      protocol: LAB
      max-window-minutes: 60
      lab-enabled: true
    - id: account-service
      name: 数据库账户样例
      downstream-id: accounts-db
      downstream-name: 本地 H2 数据库
      base-url: http://127.0.0.1:${demo.database-port:18086}
      protocol: DATABASE_V2
      max-window-minutes: 15
      lab-enabled: true
    - id: catalog-service
      name: Starter 商品服务
      downstream-id: inventory-service
      downstream-name: 库存服务
      base-url: http://127.0.0.1:${demo.catalog-port:18088}
      protocol: OBSERVATIONS_V1
      max-window-minutes: 15
      lab-enabled: false
    - id: catalog-db-service
      name: Starter 价格服务
      downstream-id: catalog-db
      downstream-name: 价格数据库
      base-url: http://127.0.0.1:${demo.catalog-database-port:18089}
      protocol: DATABASE_V2
      max-window-minutes: 15
      lab-enabled: false
    - id: ticket-service
      name: 工单源码样例
      downstream-id: assignment-service
      downstream-name: 分配服务
      base-url: http://127.0.0.1:${demo.ticket-port:18090}
      protocol: OBSERVATIONS_V3
      max-window-minutes: 15
      lab-enabled: false
